syntax = "proto3";

package tenon.source;

option java_package = "org.apache.bifromq.tenon.contracts.source";

// Carries one Source Program payload through one Pipeline-owned Submission Queue.
message IngressRecord {
  uint64 record_id = 1;
  bytes payload = 2;
}

// Carries the terminal result for one committed IngressRecord.
message IngressCompletion {
  uint64 record_id = 1;
  IngressCompletionStatus status = 2;
}

// Defines the result delivered to one Source Program send operation.
enum IngressCompletionStatus {
  INGRESS_COMPLETION_STATUS_UNSPECIFIED = 0;
  INGRESS_COMPLETION_STATUS_OK = 1;
  INGRESS_COMPLETION_STATUS_RETRY = 2;
  INGRESS_COMPLETION_STATUS_BACKPRESSURE = 3;
  INGRESS_COMPLETION_STATUS_ERROR = 4;
}
