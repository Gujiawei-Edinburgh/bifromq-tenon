syntax = "proto3";

package tenon.lua.event.test.v1;

message SourceRecordPayload {
  string device_id = 1;
  repeated uint32 registers = 2;
  bool enabled = 3;
  int32 signed_32 = 4;
  sint64 signed_64 = 5;
  uint64 unsigned_64 = 6;
  float ratio = 7;
  double score = 8;
  bytes body = 9;
  Status status = 10;
  Child child = 11;
  repeated Child children = 12;
  map<string, int32> counts = 13;
  map<uint64, Child> children_by_id = 14;
  map<bool, string> labels_by_flag = 15;
  optional int32 explicit_zero = 16;
  repeated bytes packets = 20;
  fixed32 fixed_32 = 21;
  fixed64 fixed_64 = 22;
  sfixed32 signed_fixed_32 = 23;
  sfixed64 signed_fixed_64 = 24;

  oneof choice {
    string text_choice = 17;
    int64 integer_choice = 18;
    Child child_choice = 19;
  }
}

message Child {
  string name = 1;
  bytes value = 2;
}

enum Status {
  STATUS_UNSPECIFIED = 0;
  STATUS_READY = 1;
}
