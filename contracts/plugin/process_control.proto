syntax = "proto3";

package tenon.plugin;

option java_package = "org.apache.bifromq.tenon.contracts.plugin";

// Carries the only Plugin-to-Pipeline lifecycle messages for one Plugin Instance.
message PluginToPipeline {
  oneof message {
    Attach attach = 1;
    Ready ready = 2;
    SourceQuiesced source_quiesced = 3;
  }
}

// Carries the only Pipeline-to-Plugin lifecycle commands for one Plugin Instance.
message PipelineToPlugin {
  oneof message {
    QuiesceSource quiesce_source = 1;
    Shutdown shutdown = 2;
  }
}

// Binds one lifecycle stream to the exact Plugin process launch expected by Pipeline.
message Attach {
  bytes launch_id = 1;
}

// Reports local interface readiness; it does not gate Pipeline activation or publication.
message Ready {}

// Reports that Source admission is stopped while the Instance's Sink and shared owner remain alive.
message SourceQuiesced {}

// Requests Source quiesce without terminating the Plugin Instance.
message QuiesceSource {}

// Stops this process after responsibility drain or handoff through a retained Sink Queue.
message Shutdown {}

// Opens one Pipeline-private UDS gRPC stream for one Plugin Instance process incarnation.
service PluginLifecycle {
  rpc Run(stream PluginToPipeline) returns (stream PipelineToPlugin);
}
