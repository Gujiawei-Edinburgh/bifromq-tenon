syntax = "proto3";

package tenon.lua.builder.test.v1;

message SinkRecordPayload {
  bool enabled = 1;
  int32 signed_32 = 2;
  sint64 signed_64 = 3;
  uint32 unsigned_32 = 4;
  uint64 unsigned_64 = 5;
  float ratio = 6;
  double score = 7;
  string label = 8;
  bytes body = 9;
  Status status = 10;
  Child child = 11;
  repeated int32 samples = 12;
  repeated Child children = 13;
  map<string, int32> counts = 14;
  map<uint64, Child> children_by_id = 15;
  optional int32 explicit_zero = 19;
  map<string, Child> named_children = 20;

  oneof choice {
    string text_choice = 16;
    int64 integer_choice = 17;
    Child child_choice = 18;
  }
}

message Child {
  string name = 1;
  bytes value = 2;
}

enum Status {
  STATUS_UNSPECIFIED = 0;
  STATUS_READY = 1;
}
